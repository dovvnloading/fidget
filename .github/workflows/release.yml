name: Release

# Builds a distributable Windows package on tag push.
#
# Signing uses Azure Artifact Signing via OpenID Connect: GitHub mints a
# short-lived token that Azure trusts, so no client secret is stored anywhere.
# When the AZURE_CLIENT_ID secret is absent the workflow still runs and
# produces an unsigned build, so this stays green before signing is set up.
#
# Public repository, so Actions minutes are free.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  id-token: write # Required to request the OIDC token.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ inputs.version }}'
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
          npm ci --prefix frontend

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q

      - name: Build
        shell: pwsh
        run: .\packaging\build.ps1 -Version ${{ steps.version.outputs.version }} -SkipArchive

      - name: Check for signing configuration
        id: signing
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:CLIENT_ID)
          "enabled=$($enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Host "::notice::No Azure credentials configured - producing an unsigned build."
          }

      - name: Sign in to Azure
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only Fidget.exe is signed. The bundle's 152 DLLs are third-party --
      # WebView2, pythonnet, CPython -- and already carry their vendors'
      # signatures; re-signing would replace them, and each file would consume
      # signing quota for no gain.
      - name: Sign the executable
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\dist\Fidget
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /v .\build\dist\Fidget\Fidget.exe
          if ($LASTEXITCODE -ne 0) { throw "The signature did not verify." }

      - name: Package
        id: package
        shell: pwsh
        run: |
          .\packaging\build.ps1 -Version ${{ steps.version.outputs.version }} -ArchiveOnly
          $zip = Get-ChildItem .\build\dist\*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $($zip.Name)" | Set-Content "$($zip.FullName).sha256"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Fidget-${{ steps.version.outputs.version }}-windows-x64
          path: build/dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.zip
            build/dist/*.sha256
          generate_release_notes: true
